<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Information</title>
    
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'rel='stylesheet'>
    <link rel="stylesheet" href="profile.css">
</head>

<body>

   <!-- ==============================
         SIDEBAR
    =============================== -->

    <aside class="sidebar">
        

        <div class="sidebar-header">

            <div class="logo">
                <i class='bx bx-line-chart'></i>
            </div>

            <div class="logo-text">
                <h2>ITDP</h2>
                <span>Dashboard</span>
            </div>

        </div>


        <!-- NAVIGATION -->

        <nav class="sidebar-menu">

            <p class="menu-title">MENU</p>

            <a href="dashboard.html" class="menu-item">
                <i class='bx bx-home'></i>
                <span>Dashboard</span>
            </a>

            <a href="profile.html" class="menu-item active">
                <i class='bx bx-user'></i>
                <span>Maklumat Peribadi</span>
            </a>

            <a href="employment.html" class="menu-item">
                <i class='bx bx-briefcase'></i>
                <span>Perjawatan</span>
            </a>

            <a href="training.html" class="menu-item">
                <i class='bx bx-book-open'></i>
                <span>Latihan</span>
            </a>

            <a href="academic-leadership.html" class="menu-item">
                <i class='bx bx-award'></i>
                <span>Sejarah Jawatan</span>
            </a>

        </nav>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <button id="logoutBtn" class="logout-btn">
                <i class='bx bx-log-out'></i>
                <span>Log Keluar</span>
            </button>

        </div>

    </aside>

<main class="main-content">
    <div class="container">

        <!-- HEADER -->
         
            <div class="header">

                <div>
                    <h1>Maklumat Peribadi</h1>
                    <p>Kemaskini maklumat peribadi anda</p>
                </div>

                <div class="profile-menu">

                    <button class="profile-btn" id="profileBtn">
                        <i class='bx bx-user'></i>
                    </button>

                    <div class="profile-dropdown" id="profileDropdown">

                        <div class="dropdown-user">
                            <strong id="dropdownName">-</strong>
                            <span id="dropdownStaffId">-</span>
                        </div>

                        <div class="dropdown-divider"></div>

                        <a href="employment.html">
                            <i class='bx bx-briefcase'></i>
                            Maklumat Pekerjaan
                        </a>

                        <a href="training.html">
                            <i class='bx bx-book-open'></i>
                            Maklumat Latihan
                        </a>

                        <a href="academic-leadership.html">
                            <i class='bx bx-award'></i>
                            Maklumat Sejarah Jawatan Pentadbir akademik
                        </a>

                        <a href="dashboard.html">
                            <i class='bx bx-home'></i>
                            Dashboard / Home
                        </a>

                        <button id="dropdownLogoutBtn">
                            <i class='bx bx-log-out'></i>
                            Log Keluar
                        </button>

                    </div>

                </div>

            </div>


        <!-- PROFILE CARD -->
        <div class="profile-card">

            <form id="profileForm">

                <!-- STAFF ID -->
                <div class="form-group">

                    <label for="staff_id">
                        ID Pekerja
                    </label>

                    <input
                        type="text"
                        id="staff_id"
                        placeholder="Masukkan ID Pekerja"
                        required>

                </div>


                <!-- GELARAN -->
                <div class="form-group">

                    <label for="title">
                        Gelaran
                    </label>

                    <input
                        type="text"
                        id="title"
                        placeholder="Masukkan gelaran"
                        required>

                </div>


                <!-- NAMA -->
                <div class="form-group">

                    <label for="full_name">
                        Nama
                    </label>

                    <input
                        type="text"
                        id="full_name"
                        placeholder="Masukkan nama penuh"
                        required>

                </div>


                <!-- JANTINA -->
                <div class="form-group">

                    <label for="gender">
                        Jantina
                    </label>

                    <select id="gender" required>

                        <option value="">
                            Pilih jantina
                        </option>

                        <option value="Lelaki">
                            Lelaki
                        </option>

                        <option value="Perempuan">
                            Perempuan
                        </option>

                    </select>

                </div>


                <!-- UMUR -->
                <div class="form-group">

                    <label for="age">
                        Umur
                    </label>

                    <input
                        type="number"
                        id="age"
                        min="18"
                        max="100"
                        placeholder="Masukkan umur"
                        required>

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Emel
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Masukkan emel"
                        required>

                </div>


                <!-- PHONE -->
                <div class="form-group">

                    <label for="phone">
                        No. Telefon
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="01xxxxxxxx"
                        pattern="01[0-9][0-9]{7,8}"
                        required>

                </div>


                <!-- TEMPOH BERKHIDMAT -->
                <div class="form-group">

                    <label for="service_years">
                        Tempoh Berkhidmat
                    </label>

                    <input
                        type="number"
                        id="service_years"
                        min="0"
                        max="60"
                        placeholder="Enter years of service"
                        required>

                </div>


                <!-- NAVIGATION BUTTON -->
                   
                <div class="navigation-buttons">
                    
                    <button
                        type="submit"
                        class="save-btn">

                    Simpan / Kemaskini

                    </button>

                <!-- MESSAGE -->
                <p id="message"></p>

                    <a href="employment.html" class="next-btn">
                        Seterusnya
                    </a>
                
                </div>
                


            </form>

        </div>

    </div>
</main>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <!-- PROFILE JAVASCRIPT -->
    <script src="profile.js"></script>

</body>

</html>
